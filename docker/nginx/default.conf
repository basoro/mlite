server {
    listen 0.0.0.0:80;

    root /var/www/html;
    client_max_body_size 100M;


    location / {
        index index.php;
        if (!-e $request_filename) {
            rewrite / /index.php last;
        }
    }

    location ^~ /systems/data/ {
        deny all;
        return 403;
    }

    location /admin {
        index index.php;
        try_files $uri $uri/ /admin/index.php?$args;
    }

    # Larangan eksekusi script di folder konten pengguna & aset statis.
    # .htaccess tidak berlaku di nginx, jadi aturannya didefinisikan di sini.
    # Harus berada SEBELUM location ~ \.php$ agar menang (urutan regex).
    location ~* ^/(uploads|assets)/.*\.(php[0-9]*|phtml|phar|pl|py|cgi|sh|shtml|asp|aspx|jsp|exe)$ {
        deny all;
        return 403;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
    }


}