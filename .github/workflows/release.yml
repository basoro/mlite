name: Auto Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ambil versi dari repo
        id: version
        run: |
          set -euo pipefail

          # Versi sumber kebenaran ada di mlite_db.sql: ("34","settings","version","x.y.z")
          repo_ver="$(grep -oE '"settings","version","[0-9]+(\.[0-9]+)*"' mlite_db.sql | grep -oE '[0-9]+(\.[0-9]+)*' | head -n1 || true)"

          if [ -z "$repo_ver" ]; then
            echo "Versi tidak ditemukan di mlite_db.sql, release dilewati."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Commit yang sudah ditandai versi ini? → tidak perlu release ganda
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "Commit ini sudah memiliki tag, melepas release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tag dengan versi ini sudah ada? → repo belum di-bump, dilewati
          if git rev-parse "refs/tags/$repo_ver" >/dev/null 2>&1; then
            echo "Tag $repo_ver sudah ada sedangkan mlite_db.sql masih $repo_ver."
            echo "Naikkan settings.version di mlite_db.sql untuk merilis versi baru."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Versi repo: $repo_ver → release $repo_ver"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${repo_ver}" >> "$GITHUB_OUTPUT"

      - name: Buat tag dan release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "v${TAG}" \
            --generate-notes
