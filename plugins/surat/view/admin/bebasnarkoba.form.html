<div class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">{if: $bebasnarkoba.form.id}Edit{else}Tambah{/if} Surat Bebas Narkoba</h3>
            </div>
            <div class="panel-body">
                <form name="bebasnarkoba_form" action="{?=url(ADMIN.'/surat/bebasnarkobasave/'.@$bebasnarkoba.form.id)?}" method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Nomor Surat</label>
                                <input type="text" name="nomor_surat" class="form-control" value="{$bebasnarkoba.form.nomor_surat}" required>
                            </div>
                            <div class="form-group">
                                <label>No. Rawat</label>
                                <input type="text" name="no_rawat" class="form-control" value="{$bebasnarkoba.form.no_rawat}">
                            </div>
                            <div class="form-group">
                                <label>No. Rekam Medis</label>
                                <input type="text" name="no_rkm_medis" class="form-control" value="{$bebasnarkoba.form.no_rkm_medis}">
                            </div>
                            <div class="form-group">
                                <label>Nama Pasien</label>
                                <input type="text" name="nm_pasien" class="form-control" value="{$bebasnarkoba.form.nm_pasien}" required>
                            </div>
                            <div class="form-group">
                                <label>Tanggal Lahir</label>
                                <input type="date" name="tgl_lahir" class="form-control" value="{$bebasnarkoba.form.tgl_lahir}">
                            </div>
                            <div class="form-group">
                                <label>Umur</label>
                                <input type="text" name="umur" class="form-control" value="{$bebasnarkoba.form.umur}">
                            </div>
                            <div class="form-group">
                                <label>Jenis Kelamin</label>
                                <select name="jk" class="form-control">
                                    <option value="">Pilih Jenis Kelamin</option>
                                    <option value="L" {if: $bebasnarkoba.form.jk == 'L'}selected{/if}>Laki-laki</option>
                                    <option value="P" {if: $bebasnarkoba.form.jk == 'P'}selected{/if}>Perempuan</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Alamat</label>
                                <textarea name="alamat" class="form-control" rows="3">{$bebasnarkoba.form.alamat}</textarea>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Tanggal Pemeriksaan</label>
                                <input type="date" name="tanggal" class="form-control" value="{$bebasnarkoba.form.tanggal}">
                            </div>
                            <div class="form-group">
                                <label>Hasil Pemeriksaan</label>
                                <textarea name="hasil_pemeriksaan" class="form-control" rows="4">{$bebasnarkoba.form.hasil_pemeriksaan}</textarea>
                            </div>
                            <div class="form-group">
                                <label>Keperluan</label>
                                <input type="text" name="keperluan" class="form-control" value="{$bebasnarkoba.form.keperluan}">
                            </div>
                            <div class="form-group">
                                <label>Dokter</label>
                                <input type="text" name="dokter" class="form-control" value="{$bebasnarkoba.form.dokter}">
                            </div>
                            <div class="form-group">
                                <label>Petugas</label>
                                <input type="text" name="petugas" class="form-control" value="{$bebasnarkoba.form.petugas}">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <button type="submit" name="save" class="btn btn-primary"><i class="fa fa-save"></i> Simpan</button>
                        <a href="{?=url(ADMIN.'/surat/bebasnarkoba')?}" class="btn btn-default"><i class="fa fa-arrow-left"></i> Kembali</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
