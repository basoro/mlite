<div class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <div class="row">
                    <div class="col-md-6">
                        <h3 class="panel-title" style="padding-top: 5px;" id="resume_medis_title">
                            {$resume_medis.title} &mdash; <small>{$resume_medis.total} data</small>
                        </h3>
                    </div>
                    <div class="col-md-6">
                        <form method="get" action="{$resume_medis.searchURL}" class="form-inline pull-right" id="resume_medis_search_form">
                            <input type="hidden" name="t" value="{?=htmlspecialchars(isset($_GET['t']) ? $_GET['t'] : '', ENT_QUOTES)?}">
                            <div class="input-group input-group-sm">
                                <input type="text" class="form-control" name="s" id="resume_medis_search" value="{$resume_medis.phrase}" placeholder="Cari No. RM / Nama Pasien..." autocomplete="off">
                                <div class="input-group-btn">
                                    <button class="btn btn-default" type="submit"><i class="fa fa-search"></i></button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div id="resume_medis_results">
                <div class="panel-body" style="padding: 0;">
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered" style="margin-bottom: 0;">
                            <thead>
                                <tr>
                                    <th>No. RM</th>
                                    <th>Nama Pasien</th>
                                    <th class="text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                {loop: $resume_medis.list}
                                <tr>
                                    <td>{$value.no_rkm_medis}</td>
                                    <td>{$value.nm_pasien}</td>
                                    <td class="text-center">
                                        <a href="{$value.printURL}" class="btn btn-primary btn-xs" target="_blank"><i class="fa fa-print"></i> Print</a>
                                    </td>
                                </tr>
                                {/loop}
                                {if: !$resume_medis.list}
                                <tr>
                                    <td colspan="3" class="text-center text-muted">Tidak ada data</td>
                                </tr>
                                {/if}
                            </tbody>
                        </table>
                    </div>
                    {if: $resume_medis.pagination}
                    <div style="padding: 10px 15px;">
                        {$resume_medis.pagination}
                    </div>
                    {/if}
                </div>
            </div>
        </div>
    </div>
</div>
<script>
(function() {
    var searchURL = {?=json_encode($resume_medis.searchURL)?};
    var $input = $('#resume_medis_search');
    var $results = $('#resume_medis_results');
    var $title = $('#resume_medis_title');
    var timer = null;

    function doSearch() {
        var val = $input.val();
        $.get(searchURL, { s: val, t: mlite.token }, function(html) {
            var $html = $('<div>').html(html);
            $title.html($html.find('#resume_medis_title').html());
            $results.html($html.find('#resume_medis_results').html());
        });
    }

    $input.on('input', function() {
        clearTimeout(timer);
        timer = setTimeout(doSearch, 400);
    });

    $('#resume_medis_search_form').on('submit', function(event) {
        event.preventDefault();
        clearTimeout(timer);
        doSearch();
    });
})();
</script>
