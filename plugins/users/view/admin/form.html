<div class="row">
    <div class="col-md-6">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">{?=isset_or($users.title)?}</h3>
            </div>
            <div class="panel-body">
    		<form name="user" action="{?=url(ADMIN.'/users/save/'.@$users.form.id)?}" method="POST" enctype="multipart/form-data">
    			<fieldset>
    	            <!--<div class="form-group">
    	                <label>Pengguna</label>
    	                <input type="text" name="username" class="form-control" required value="{?=isset_or($users.form.username)?}" />
    	            </div>-->
                  {if: !empty($users.user)}
                  <div class="form-group">
                      <label>Pengguna</label>
                      <select name="username" id="username" class="form-control" data-use-search="true" onchange="document.getElementById('fullname').value=this.options[this.selectedIndex].text.split(' -')[0]">
                          {loop: $users.user}
                              <option value="{?=isset_or($value.nik)?}"{if: $users.form.username == $value.nik} selected{/if}>{?=isset_or($value.nama)?} - {?=isset_or($value.nik)?}</option>
                          {/loop}
                      </select>
                  </div>
                  {else}
                  <div class="form-group">
    	                <label>Pengguna</label>
    	                <input type="text" name="username" id="username" class="form-control" placeholder="Nama Pengguna" value="{?=isset_or($users.form.username)?}" />
    	            </div>
                  {/if}
    	            <div class="form-group">
    	                <label>Nama lengkap</label>
    	                <input type="text" name="fullname" id="fullname" class="form-control" placeholder="Nama lengkap (optional)" value="{?=isset_or($users.form.fullname)?}" />
    	            </div>
					        <div class="form-group">
    	                <label>Foto</label>
          						<div>
          							<img src="{?=isset_or($users.avatarURL)?}" width="96" height="96" class="img-thumbnail" id="photoPreview" style="cursor:pointer;" onclick="$('input[name=photo]').click()" />
          							<input type="file" name="photo" class="form-control hidden" />
          						</div>
    	            </div>
                  <div class="form-group">
      	                <label>Deskripsi</label>
      	                <textarea class="form-control" name="description" placeholder="Deskripsi (optional)" rows="6">{?=isset_or($users.form.description)?}</textarea>
    	            </div>
    	            <div class="form-group">
    	                <label>Email</label>
    	                <input type="email" name="email" class="form-control" required value="{?=isset_or($users.form.email)?}" />
    	            </div>
    	            <div class="form-group">
    	                <label>Kata kunci {if: isset($users.form.id)}<a href="#" id="passwordChange" class="btn btn-default btn-xs">Ubah</a>{/if}</label>
    	                <input type="password" name="password" id="password" class="form-control" pattern=".{8,}" title="Password minimal 8 karakter, memuat huruf besar, huruf kecil, dan angka" autocomplete="new-password" {if: isset($users.form.id)}value="********" placeholder="Kata kunci baru" disabled {else}required{/if}/>
    	                <div id="passwordStrength" style="display:none; margin-top:8px;">
    	                    <div class="progress" style="height:8px; margin-bottom:6px;">
    	                        <div id="passwordStrengthBar" class="progress-bar" role="progressbar" style="width:0%;"></div>
    	                    </div>
    	                    <small id="passwordStrengthLabel">Kekuatan: <strong>-</strong></small>
    	                    <ul class="list-unstyled" style="margin:6px 0 0; font-size:12px;">
    	                        <li id="pwRuleLen"><i class="fa fa-times text-danger"></i> Minimal 8 karakter</li>
    	                        <li id="pwRuleLower"><i class="fa fa-times text-danger"></i> Huruf kecil (a-z)</li>
    	                        <li id="pwRuleUpper"><i class="fa fa-times text-danger"></i> Huruf besar (A-Z)</li>
    	                        <li id="pwRuleDigit"><i class="fa fa-times text-danger"></i> Angka (0-9)</li>
    	                    </ul>
    	                </div>
    	            </div>
    	            <div class="form-group" id="passwordConfirmGroup">
    	                <label>Ulangi kata kunci</label>
    	                <input type="password" name="password_confirmation" id="password_confirmation" class="form-control" placeholder="Ulangi kata kunci" autocomplete="new-password" {if: isset($users.form.id)}disabled{else}required{/if}/>
    	            </div>
                  <div class="form-group">
                      <label>Role (Bisa lebih dari satu)</label>
                      <select name="role[]" class="form-control" multiple>
                        {loop: $users.role}
                          <option value="{?=isset_or($value.name)?}" {?=isset_or($value.attr)?}>{?=isset_or($value.name)?}</option>
                        {/loop}
                      </select>
                  </div>
                  {if: !empty($users.cap)}
                  <div class="form-group">
                      <label>Capability</label>
                      <select name="cap[]" multiple class="form-control">
                        {loop: $users.cap}
                          <option value="{?=isset_or($value.cap)?}" {?=isset_or($value.attr)?}>{?=isset_or($value.nm_cap)?} - {?=isset_or($value.cap)?}</option>
                        {/loop}
                      </select>
                  </div>
                  {/if}
    	            <div class="form-group">
                      <label>Akses</label>
                        <button type="button" id="btnToggleCopyAccess" class="btn btn-success badge">
                            <i class="fa fa-copy"></i> Copy Akses
                        </button>
                        <div id="copyAccessForm" style="display: none; margin-top: 15px; margin-bottom: 15px;">
                            <h5><strong>Copy Akses dari Pengguna Lain</strong></h5>
                            <!-- <small class="text-muted">Pilih pengguna yang sudah ada untuk menyalin pengaturan aksesnya.</small> -->
                            <div class="input-group">
                                <select id="copyAccessFromUser" class="form-control" data-use-search="true">
                                    <option value="">-- Pilih Pengguna untuk Disalin Aksesnya --</option>
                                    {loop: $users.usersForCopy}
                                        <option value="{$value.id}" data-access="{$value.access}">{$value.fullname} ({$value.username})</option>
                                    {/loop}
                                </select>
                                <span class="input-group-btn">
                                    <button type="button" id="btnCopyAccess" class="btn btn-info" disabled>
                                        <i class="fa fa-copy"></i> Salin Akses
                                    </button>
                                </span>
                            </div>
                        </div>
                        <select name="access[]" id="accessSelect" multiple class="form-control" data-keep-open="true" data-use-search="true" data-use-dimmer="false" data-options-height="126px" {if: isset_or($users.form.id, 0) == 1}disabled{/if} required>
                            {loop: $users.modules}
                            <option value="{$value.dir}" data-font="<i class='fa fa-{$value.icon}'></i>" {$value.attr}>{$value.name}</option>
                            {/loop}
                        </select>
                    </div>
    	            <div class="form-group">
    	                <input type="submit" name="save" class="btn btn-primary" value="Simpan" />
    	            </div>
                </fieldset>
            </form>
            </div>
        </div>
    </div>
</div>

<script>
	// Avatar
	var reader  = new FileReader();
	reader.addEventListener("load", function() {
		$("#photoPreview").attr('src', reader.result);
	}, false);
	$("input[name=photo]").change(function() {
		reader.readAsDataURL(this.files[0]);
	});

	// Password: indikator kekuatan & konfirmasi
	// catatan: jangan pakai nama variabel ber-prefix $ (di-ganti mesin template)
	var pwInput   = $("input[name=password]");
	var pwConfirm = $("input[name=password_confirmation]");

	function pwRules(value) {
		return {
			len:    value.length >= 8,
			lower:  /[a-z]/.test(value),
			upper:  /[A-Z]/.test(value),
			digit:  /[0-9]/.test(value)
		};
	}

	function pwEvaluateConfirm() {
		var value = pwInput.val();
		var confValue = pwConfirm.val();
		var active = !pwConfirm.prop('disabled') && !pwInput.prop('disabled') && value !== '********';

		if (!active) {
			pwConfirm[0].setCustomValidity("");
			return;
		}
		var mismatch = confValue !== '' && confValue !== value;
		pwConfirm[0].setCustomValidity(mismatch ? 'Konfirmasi password tidak cocok.' : '');
	}

	function pwEvaluate() {
		var value = pwInput.val();
		var active = !pwInput.prop('disabled') && value !== '********';

		if (!active) {
			$("#passwordStrength").hide();
			pwInput[0].setCustomValidity("");
			pwEvaluateConfirm();
			return;
		}

		$("#passwordStrength").show();

		var rules = pwRules(value);
		var states = [
			['#pwRuleLen', rules.len],
			['#pwRuleLower', rules.lower],
			['#pwRuleUpper', rules.upper],
			['#pwRuleDigit', rules.digit]
		];
		var passed = 0;
		$.each(states, function (i, item) {
			if (item[1]) passed++;
			$(item[0]).find('i').attr('class', item[1] ? 'fa fa-check text-success' : 'fa fa-times text-danger');
		});

		var levels = [
			{ min: 0, label: 'Lemah',       color: '#d9534f' },
			{ min: 2, label: 'Sedang',      color: '#f0ad4e' },
			{ min: 3, label: 'Kuat',        color: '#5bc0de' },
			{ min: 4, label: 'Sangat kuat', color: '#5cb85c' }
		];
		var level = levels[0];
		$.each(levels, function (i, item) {
			if (passed >= item.min) level = item;
		});

		$("#passwordStrengthBar").css({
			width: (passed / states.length * 100) + '%',
			'background-color': level.color
		});
		$("#passwordStrengthLabel").html('Kekuatan: <strong>' + level.label + '</strong>');

		// blokir submit lewat validasi native browser
		var missing = [];
		if (!rules.len) missing.push('minimal 8 karakter');
		if (!rules.lower) missing.push('huruf kecil');
		if (!rules.upper) missing.push('huruf besar');
		if (!rules.digit) missing.push('angka');
		pwInput[0].setCustomValidity((value !== '' && missing.length) ? ('Password harus memuat ' + missing.join(', ') + '.') : '');

		pwEvaluateConfirm();
	}

	pwInput.on('input focus', pwEvaluate);
	pwConfirm.on('input', pwEvaluateConfirm);

	// Password
	$("#passwordChange").on("click", function() {
		pwInput.val("").attr('disabled', false).attr('required', true);
		pwConfirm.attr('disabled', false).attr('required', true);
		$(this).remove();
		pwEvaluate();
		pwInput.focus();
		return false;
	})

	pwEvaluate();

	// Tombol copy akses
    $('#btnToggleCopyAccess').on('click', function() {
        var copyForm = $('#copyAccessForm');
        var button = $(this);
        
        if (copyForm.is(':visible')) {
            copyForm.slideUp();
            button.html('<i class="fa fa-copy"></i> Copy Akses');
            button.removeClass('btn-warning').addClass('btn-success');
        } else {
            copyForm.slideDown();
            button.html('<i class="fa fa-times"></i> Tutup Copy Akses');
            button.removeClass('btn-success').addClass('btn-warning');
        }
    });

	// Enable/disable Tombol Salin Akses
    $('#copyAccessFromUser').on('change', function() {
        var selectedValue = $(this).val();
        $('#btnCopyAccess').prop('disabled', !selectedValue);
    });

	// Copy access from selected user
    $('#btnCopyAccess').on('click', function() {
        var selectedOption = $('#copyAccessFromUser option:selected');
        var access = selectedOption.data('access');
        
        if(access) {
            $('#accessSelect option').prop('selected', false);
            
            // Check if access is 'all' - select all available modules
            if(access.trim() === 'all') {
                $('#accessSelect option').prop('selected', true);
            } else {
                // Normal case - select specific modules
                var accessArray = access.split(',');
                $.each(accessArray, function(index, value) {
                    $('#accessSelect option[value="' + value.trim() + '"]').prop('selected', true);
                });
            }
            
            $('#accessSelect').trigger('change');
            
            //alert('Akses berhasil disalin dari pengguna: ' + selectedOption.text());
        }
    });
</script>
