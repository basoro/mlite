<div class="row">
    <div class="col-md-6">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Test Kirim Template Message</h3>
            </div>
            <div class="panel-body">
              <form method="POST" action="{?=url([ADMIN,'wagateway','sendtemplate'])?}">
                <div class="form-group">
                  <label>Nomor Tujuan :</label>
                  <input type="text" class="form-control" name="number" placeholder="081234567890">
                </div>
                <div class="form-group">
                  <label>Message :</label>
                  <textarea name="message" class="form-control" rows="4" placeholder="Halo, pilih aksi:"></textarea>
                </div>
                <div class="form-group">
                  <label>Template 1 :</label>
                  <input type="text" class="form-control" name="template1" placeholder="url|Website|https://example.com">
                  <small class="text-muted">Format: <code>url|Label|URL</code> atau <code>call|Label|Nomor telepon</code></small>
                </div>
                <div class="form-group">
                  <label>Template 2 :</label>
                  <input type="text" class="form-control" name="template2" placeholder="call|Customer Service|081234567890">
                  <small class="text-muted">Format: <code>url|Label|URL</code> atau <code>call|Label|Nomor telepon</code></small>
                </div>
                <div class="form-group">
                  <label>Footer :</label>
                  <input type="text" class="form-control" name="footer" placeholder="mLITE WA Gateway">
                </div>
                <p class="text-muted">Mengirim pesan dengan 2 tombol bertipe URL atau telepon ke nomor tujuan.</p>
                <button type="submit" class="btn btn-primary" name="submit">SEND</button>
              </form>
            </div>
        </div>
    </div>
</div>
