<div class="row">
    <div class="col-md-6">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Test Kirim Button Message</h3>
            </div>
            <div class="panel-body">
              <form method="POST" action="{?=url([ADMIN,'wagateway','sendbutton'])?}">
                <div class="form-group">
                  <label>Nomor Tujuan :</label>
                  <input type="text" class="form-control" name="number" placeholder="081234567890">
                </div>
                <div class="form-group">
                  <label>Message :</label>
                  <textarea name="message" class="form-control" rows="4" placeholder="Silakan pilih:"></textarea>
                </div>
                <div class="form-group">
                  <label>Label Tombol 1 :</label>
                  <input type="text" class="form-control" name="button1" placeholder="Ya">
                </div>
                <div class="form-group">
                  <label>Label Tombol 2 :</label>
                  <input type="text" class="form-control" name="button2" placeholder="Tidak">
                </div>
                <div class="form-group">
                  <label>Footer :</label>
                  <input type="text" class="form-control" name="footer" placeholder="mLITE WA Gateway">
                </div>
                <p class="text-muted">Mengirim pesan dengan footer dan 2 tombol quick reply ke nomor tujuan.</p>
                <button type="submit" class="btn btn-primary" name="submit">SEND</button>
              </form>
            </div>
        </div>
    </div>
</div>
